<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="eleSlate" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#90A0B5"/>
      <stop offset="100%" stop-color="#69798F"/>
    </linearGradient>
    <linearGradient id="earLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B4C1D1"/>
      <stop offset="100%" stop-color="#94A4B8"/>
    </linearGradient>
    <linearGradient id="bookPage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F7FA"/>
    </linearGradient>
    <linearGradient id="ribbonWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0A165"/>
      <stop offset="100%" stop-color="#D97B41"/>
    </linearGradient>
    <filter id="cleanShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4A5A70" flood-opacity="0.12"/>
    </filter>
    <clipPath id="roundedClip">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedClip)">
    <!-- Pure White Background -->
    <rect width="1024" height="1024" fill="#FFFFFF"/>
  </g>

  <g filter="url(#cleanShadow)">
    <!-- Minimalist Open Book -->
    <path d="M206 646 C290 614, 418 616, 512 664 C606 616, 734 614, 818 646
             L798 742 C720 712, 604 714, 512 758 C420 714, 304 712, 226 742 Z"
          fill="url(#bookPage)" stroke="#D4DCE6" stroke-width="6" stroke-linejoin="round"/>
    <path d="M512 664 L512 756" stroke="#CCD6E2" stroke-width="6" stroke-linecap="round"/>

    <!-- Minimalist Warm Bookmark ("阅痕") -->
    <path d="M542 730 L592 716 L592 842 L567 818 L542 842 Z" fill="url(#ribbonWarm)"/>

    <!-- Minimalist Soft Grey-Blue Little Elephant -->
    <path d="M324 610
             C304 548, 308 446, 364 374
             C410 314, 488 286, 562 302
             C630 318, 672 372, 678 440
             C682 486, 706 512, 738 506
             C760 502, 772 482, 766 462
             C762 448, 748 444, 742 452
             C730 424, 760 396, 790 410
             C826 428, 832 482, 808 522
             C778 568, 714 584, 658 556
             C632 544, 622 574, 620 608
             C568 596, 536 608, 512 624
             C476 604, 394 598, 324 610 Z"
          fill="url(#eleSlate)"/>

    <!-- Soft Ear with Delicate Page Lines -->
    <path d="M452 348
             C388 350, 352 410, 362 476
             C370 530, 418 558, 468 544
             C506 534, 526 488, 520 432
             C514 376, 490 346, 452 348 Z"
          fill="url(#earLight)"/>
    <path d="M408 414 C432 408, 458 418, 474 434" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.88"/>
    <path d="M404 456 C428 452, 452 460, 468 474" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.68"/>

    <!-- Clean Expressive Eye -->
    <circle cx="598" cy="412" r="14" fill="#FFFFFF"/>
    <circle cx="601" cy="410" r="6" fill="#2E3B4E"/>

    <!-- Tiny Warm Sparkle -->
    <path d="M772 282 L781 308 L807 317 L781 326 L772 352 L763 326 L737 317 L763 308 Z" fill="#EC9A5E"/>
  </g>
</svg>
