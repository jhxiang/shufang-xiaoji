<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E6B56"/>
      <stop offset="55%" stop-color="#215342"/>
      <stop offset="100%" stop-color="#173D30"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F2EAE0"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4884E"/>
      <stop offset="100%" stop-color="#C86431"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <circle cx="840" cy="180" r="240" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="190" cy="860" r="210" fill="#E89A63" opacity="0.10"/>

  <!-- Bookshelf & Open Book Emblem -->
  <g transform="translate(182, 198)">
    <!-- Back Hardcover -->
    <rect x="30" y="34" width="600" height="560" rx="54" fill="#133328" opacity="0.45"/>
    <!-- Main Book Cover -->
    <rect x="40" y="20" width="580" height="560" rx="48" fill="url(#pageGrad)"/>
    <!-- Spine Binding Left -->
    <path d="M88 20 H148 V580 H88 A48 48 0 0 1 40 532 V68 A48 48 0 0 1 88 20 Z" fill="#D9CFC1"/>
    <rect x="148" y="20" width="10" height="560" fill="#C4B8A6"/>

    <!-- Bookmark Ribbon -->
    <path d="M474 20 H548 V264 L511 224 L474 264 Z" fill="url(#ribbonGrad)"/>

    <!-- Minimal Literary Lines -->
    <rect x="210" y="138" width="210" height="22" rx="11" fill="#255B48" opacity="0.88"/>
    <rect x="210" y="196" width="146" height="16" rx="8" fill="#8C8377" opacity="0.65"/>

    <!-- Decorative Spine Row Motif at bottom -->
    <rect x="210" y="310" width="56" height="190" rx="14" fill="#3B7A63"/>
    <rect x="282" y="336" width="48" height="164" rx="12" fill="#D57A46"/>
    <rect x="346" y="294" width="62" height="206" rx="14" fill="#4E6D8C"/>
    <rect x="424" y="348" width="50" height="152" rx="12" fill="#A65E6E"/>
    <rect x="490" y="322" width="44" height="178" rx="12" fill="#B88B3B"/>
    <!-- Shelf Ledge -->
    <rect x="196" y="498" width="356" height="18" rx="9" fill="#9E8970"/>
  </g>
</svg>
