<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#357A62"/>
      <stop offset="52%" stop-color="#225745"/>
      <stop offset="100%" stop-color="#14372B"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0.28" cy="0.22" r="0.65">
      <stop offset="0%" stop-color="#8FE3C2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8FE3C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="creamGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#EFE7DA"/>
    </linearGradient>
    <linearGradient id="earGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7DDD0"/>
      <stop offset="100%" stop-color="#D4C6B3"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2A462"/>
      <stop offset="100%" stop-color="#D26D36"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0B221A" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- Full-bleed App Background (iOS masks corners automatically) -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" fill="url(#glowTop)"/>
  <circle cx="835" cy="195" r="220" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="195" cy="845" r="210" fill="#F2A462" opacity="0.09"/>

  <!-- Main Emblem: Minimalist Elephant resting on an Open Book with Bookmark Trail -->
  <g filter="url(#softShadow)">
    <path d="M188 648 C275 612, 412 612, 512 664 C612 612, 749 612, 836 648
             L814 754 C732 722, 608 724, 512 772 C416 724, 292 722, 210 754 Z"
          fill="#DFD4C4"/>
    <path d="M198 624 C284 588, 416 590, 512 642 C608 590, 740 588, 826 624
             L806 726 C726 694, 606 696, 512 744 C418 696, 298 694, 218 726 Z"
          fill="url(#creamGrad)"/>
    <path d="M512 642 L512 744" stroke="#C5B6A2" stroke-width="6" stroke-linecap="round"/>

    <path d="M538 724 L594 708 L594 846 L566 820 L538 846 Z" fill="url(#ribbonGrad)"/>

    <path d="M312 606
             C292 544, 296 440, 354 366
             C402 304, 484 274, 562 292
             C634 308, 676 364, 682 434
             C686 482, 712 510, 744 504
             C768 500, 780 478, 774 456
             C770 442, 756 436, 748 446
             C736 416, 768 386, 798 402
             C836 422, 842 478, 816 520
             C786 568, 718 584, 660 554
             C634 540, 622 572, 620 606
             C566 592, 534 606, 512 622
             C474 600, 386 594, 312 606 Z"
          fill="url(#creamGrad)"/>

    <path d="M448 338
             C382 340, 344 402, 354 472
             C362 528, 412 558, 466 544
             C506 534, 526 486, 520 426
             C514 368, 488 336, 448 338 Z"
          fill="url(#earGrad)"/>
    <path d="M402 406 C428 400, 456 410, 474 428" fill="none" stroke="#FFFDF8" stroke-width="10" stroke-linecap="round" opacity="0.72"/>
    <path d="M398 452 C424 448, 450 456, 466 472" fill="none" stroke="#FFFDF8" stroke-width="9" stroke-linecap="round" opacity="0.55"/>

    <circle cx="600" cy="404" r="15" fill="#1E4E3D"/>
    <circle cx="605" cy="399" r="5" fill="#FFFDF8"/>
    <ellipse cx="566" cy="442" rx="18" ry="11" fill="#E99A6B" opacity="0.32"/>

    <path d="M778 268 L788 296 L816 306 L788 316 L778 344 L768 316 L740 306 L768 296 Z" fill="#F6BD7A"/>
    <circle cx="718" cy="264" r="10" fill="#F6BD7A" opacity="0.8"/>
  </g>
</svg>
