name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 小象阅痕 (XiaoxiangYuehen.ipa)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Clean & sync web assets into iOS bundle
        run: |
          rm -rf ios/ShufangXiaoji/WebApp/*
          chmod +x scripts/sync-web-assets.sh
          ./scripts/sync-web-assets.sh
          find ios/ShufangXiaoji/WebApp -name ".DS_Store" -delete

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (Release, unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ShufangXiaoji.xcodeproj \
            -scheme ShufangXiaoji \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build | tee xcodebuild.log

      - name: Package into unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/ShufangXiaoji.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到构建产物: $APP_PATH" >&2
            find build/Build/Products -maxdepth 3 -name "*.app" -print >&2
            exit 1
          fi

          rm -rf build/Payload XiaoxiangYuehen.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          # 未签名包需移除可能残留的签名文件
          rm -rf "build/Payload/ShufangXiaoji.app/_CodeSignature"
          rm -f "build/Payload/ShufangXiaoji.app/embedded.mobileprovision"

          cd build
          zip -qry ../XiaoxiangYuehen.ipa Payload
          cd ..
          ls -lh XiaoxiangYuehen.ipa
          shasum -a 256 XiaoxiangYuehen.ipa | tee XiaoxiangYuehen.ipa.sha256

      - name: Verify IPA structure
        working-directory: ios
        run: |
          unzip -l XiaoxiangYuehen.ipa | head -30
          unzip -l XiaoxiangYuehen.ipa | grep -q "Payload/ShufangXiaoji.app/WebApp/index.html" \
            && echo "内置 Web 资源校验通过" \
            || { echo "IPA 内缺少 WebApp 资源" >&2; exit 1; }
          unzip -l XiaoxiangYuehen.ipa | grep -q "Payload/ShufangXiaoji.app/AppIcon" \
            && echo "AppIcon 校验通过" || true
          DISPLAY_NAME=$(plutil -extract CFBundleDisplayName raw build/Payload/ShufangXiaoji.app/Info.plist)
          echo "IPA CFBundleDisplayName = $DISPLAY_NAME"
          if [ "$DISPLAY_NAME" != "小象阅痕" ]; then
            echo "App 显示名不是小象阅痕: $DISPLAY_NAME" >&2
            exit 1
          fi
          plutil -extract UILaunchScreen xml1 -o /dev/null build/Payload/ShufangXiaoji.app/Info.plist \
            && echo "UILaunchScreen 全屏适配校验通过" \
            || { echo "缺少 UILaunchScreen，会导致 iPhone 屏幕缩放黑边" >&2; exit 1; }
          if unzip -l XiaoxiangYuehen.ipa | grep -iE "(\.DS_Store|__MACOSX|test_|\.spec\.|demo_books)"; then
            echo "IPA 内发现残留测试或临时文件" >&2
            exit 1
          fi
          echo "IPA 纯净度校验通过"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaoxiangYuehen-ipa
          path: |
            ios/XiaoxiangYuehen.ipa
            ios/XiaoxiangYuehen.ipa.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
