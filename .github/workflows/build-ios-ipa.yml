name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ShufangXiaoji.ipa
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/MacOS/Xcode || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/MacOS/Xcode
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Sync web assets into iOS bundle
        run: |
          chmod +x scripts/sync-web-assets.sh
          ./scripts/sync-web-assets.sh

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (Release, unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ShufangXiaoji.xcodeproj \
            -scheme ShufangXiaoji \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build | tee xcodebuild.log

      - name: Package into unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/ShufangXiaoji.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到构建产物: $APP_PATH" >&2
            find build/Build/Products -maxdepth 3 -name "*.app" -print >&2
            exit 1
          fi

          rm -rf build/Payload ShufangXiaoji.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          # 未签名包需移除可能残留的签名文件
          rm -rf "build/Payload/ShufangXiaoji.app/_CodeSignature"
          rm -f "build/Payload/ShufangXiaoji.app/embedded.mobileprovision"

          cd build
          zip -qry ../ShufangXiaoji.ipa Payload
          cd ..
          ls -lh ShufangXiaoji.ipa
          shasum -a 256 ShufangXiaoji.ipa | tee ShufangXiaoji.ipa.sha256

      - name: Verify IPA structure
        working-directory: ios
        run: |
          unzip -l ShufangXiaoji.ipa | head -30
          unzip -l ShufangXiaoji.ipa | grep -q "Payload/ShufangXiaoji.app/WebApp/index.html" \
            && echo "内置 Web 资源校验通过" \
            || { echo "IPA 内缺少 WebApp 资源" >&2; exit 1; }
          unzip -l ShufangXiaoji.ipa | grep -q "Payload/ShufangXiaoji.app/AppIcon" \
            && echo "AppIcon 校验通过" || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShufangXiaoji-ipa
          path: |
            ios/ShufangXiaoji.ipa
            ios/ShufangXiaoji.ipa.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
